<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goodaiPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="goodaiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Circular Track / Stylized Monogram G -->
  <!-- Upper arc of G: from (80, 48) around top to (20, 50) -->
  <path d="M 52 14 C 32 14, 16 30, 16 50 C 16 70, 32 86, 52 86 C 70 86, 84 72, 85 54" 
        stroke="url(#goodaiPulseGrad)" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        filter="url(#goodaiGlow)" />

  <!-- Inner Telemetry Heartbeat / Pulse Waveform originating from center of G -->
  <path d="M 42 50 L 52 50 L 60 26 L 68 74 L 74 50 L 85 50" 
        stroke="url(#goodaiPulseGrad)" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#goodaiGlow)" />

  <!-- Active Telemetry Status Core Beacon -->
  <circle cx="85" cy="50" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
